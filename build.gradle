plugins {
    id 'java'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
}

group = 'com.qa.quick.fix'
version = '1.0-SNAPSHOT'

spotless {
    java {
        googleJavaFormat('1.17.0')
        target 'src/**/*.java'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // QuickFIX/J Core
    implementation 'org.quickfixj:quickfixj-core:2.3.1'
    implementation 'org.quickfixj:quickfixj-messages-all:2.3.1'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    implementation 'ch.qos.logback:logback-core:1.4.11'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.13.0'

    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'

    // Lombok (compile-time only)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'

    // Integration Testing
    testImplementation 'org.testcontainers:junit-jupiter:1.19.0'
    testImplementation 'org.testcontainers:testcontainers:1.19.0'
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.10'
}

tasks.test {
    finalizedBy tasks.jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.10
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// Convenience task to run the FIXMessageExtractor demo main
tasks.register('runExtractor', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.qa.quick.fix.poc.builder.FIXMessageExtractor'
    if (project.hasProperty('dict')) {
        args(project.property('dict'))
    }
}

// Run the local reproduction demo (acceptor + client)
tasks.register('runRepro', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.qa.quick.fix.poc.demo.ReproMain'
}
